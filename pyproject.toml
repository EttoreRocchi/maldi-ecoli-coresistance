[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maldi-ecoli-coresistance"
version = "1.0.0"
description = "Analysis code for 'A regime for exploiting resistance co-occurrence in machine learning prediction of Escherichia coli cephalosporin resistance from MALDI-TOF spectra'"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ettore Rocchi", email = "ettore.rocchi@aosp.bo.it" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.6,<1.8",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "fonttools>=4.40",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.64",
    "maldiamrkit==0.7.0",
    "pubfig==0.3.0",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2.8"]
tabpfn = ["tabpfn==6.3.0", "torch>=2.1"]
dev = ["ruff>=0.6", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["results", "figures", "tables", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# analysis scripts: long compact lines, one-line statements and late imports (after configuring matplotlib) are deliberate
ignore = ["E501", "E701", "E702", "E731", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # package re-exports

[tool.ruff.lint.isort]
known-first-party = ["mecor"]
