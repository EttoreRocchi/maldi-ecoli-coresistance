# Base configuration shared across all datasets
model: logistic
run_binary_relevance: true
run_classifier_chain: true

seed: 42
n_jobs: -1
n_splits_outer: 5
n_repeats_outer: 3
n_splits_inner: 3
param_search_mode: full

save_fitted_models: true
load_saved_models: true
model_compression: 3

bin_width: 3
mz_min: 2000
mz_max: 20000
confidence_level: 0.95
dpi: 300
top_features_to_plot: 20
min_class_frequency: 0.05
max_class_frequency: 0.95
log_level: INFO

plot_ylimits:
  AUROC: [0.5, 1.05]
  MCC: [0.0, 1.05]
  Balanced Acc: [0.5, 1.05]
  F1 (weighted): [0.5, 1.05]
