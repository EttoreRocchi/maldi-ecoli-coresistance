# DRIAMS-A with patient-grouped folds: all isolates of a patient (patient_no of id/<year>/<year>_strat.csv)
# stay on the same side of every outer and inner split. Separate output folder from results/driams_a.
_base: base.yaml
dataset_name: driams_a_grouped
binned_dir: ${DRIAMS_ROOT}/DRIAMS-A/binned_6000
metadata_path: ${DRIAMS_ROOT}/DRIAMS-A/id
output_dir: results/driams_a_grouped

driams_years:
  - "2015"
  - "2016"
  - "2017"
  - "2018"

targets:
  - Ciprofloxacin
  - Ceftriaxone
  - Ceftazidime

target_short_names:
  Ciprofloxacin: CIP
  Ceftriaxone: CRO
  Ceftazidime: CAZ

species: Escherichia coli
group_by_patient: true

# the main-analysis grid without saga (same C values and penalties)
param_search_mode: liblinear_full
